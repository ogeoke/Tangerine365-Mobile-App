name: sevenup_mobile
description: A new Flutter project.
# The following line prevents the package from being accidentally published to
# pub.dev using `flutter pub publish`. This is preferred for private packages.
publish_to: 'none' # Remove this line if you wish to publish to pub.dev

version: 1.0.0+8

environment:
  sdk: '>=3.8.0 <4.0.0'

# Dependencies specify other packages that your package needs in order to work.
# To automatically upgrade your package dependencies to the latest versions
# consider running `flutter pub upgrade --major-versions`. Alternatively,
# dependencies can be manually updated by changing the version numbers below to
# the latest version available on pub.dev. To see which dependencies have newer
# versions available, run `flutter pub outdated`.
dependencies:
  flutter:
    sdk: flutter
  cached_network_image: ^3.4.1
  flutter_math_fork: ^0.7.4
  # chopper: ^8.0.1+1
  # connectivity_plus: ^6.0.4
  date_format: ^2.0.9
  dots_indicator: ^4.0.1
  equatable: ^2.0.7
  flutter_bloc: ^8.1.6
  # flutter_html: ^2.2.1
  # flutter_inappwebview: ^6.0.0
  flutter_secure_storage: ^9.2.4
  # flutter_widget_from_html: ^0.17.0
  flutter_html: ^3.0.0
  flutter_svg: ^2.2.0
  get_it: ^8.2.0
  # introduction_screen: ^3.1.8
  json_annotation: ^4.9.0
  local_auth: ^2.3.0
  logging: ^1.3.0
  pie_chart: ^5.4.0
  path_provider: ^2.1.5
  pull_to_refresh: ^2.0.0
  provider: ^6.1.5
  shared_preferences: ^2.5.3
  url_launcher: ^6.3.2
  # webview_flutter: ^4.9.0
  cupertino_icons: ^1.0.8
  data_repository: ^0.5.1
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  freezed_annotation: ^3.1.0
  smooth_page_indicator: ^1.2.1
  # simple_secure_storage: ^0.3.1
  # webviewx_plus: ^0.5.0
  webview_flutter: ^4.13.1
  flutter_animate: ^4.5.2
  html: ^0.15.6
  shimmer: ^3.0.0
  # flutter_html: ^3.0.0-beta.2
  # native_webview: ^1.4.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  chopper_generator: ^8.3.0
  test: any
  build_runner: any
  flutter_gen: ^5.1.0+1
  flutter_gen_runner: null
  json_serializable: ^6.10.0

  # The "flutter_lints" package below contains a set of recommended lints to
  # encourage good coding practices. The lint set provided by the package is
  # activated in the `analysis_options.yaml` file located at the root of your
  # package. See that file for information about deactivating specific lint
  # rules and activating additional ones.
  flutter_lints: ^4.0.0

# For information on the generic Dart part of this file, see the
# following page: https://dart.dev/tools/pub/pubspec
flutter_gen:
  integrations:
    flutter_svg: true
# The following section is specific to Flutter packages.
flutter:
  uses-material-design: true
  generate: true
  assets:
  - assets/images/
  - assets/svg/

  fonts:
  - family: Manrope
    fonts:
    - asset: assets/fonts/Manrope/Manrope-Variable.ttf
  - family: Inter
    fonts:
    - asset: assets/fonts/Inter/Inter_28pt-Bold.ttf
      weight: 700
      style: normal
    - asset: assets/fonts/Inter/Inter_24pt-ExtraBold.ttf
      weight: 900
      style: normal
  - family: Jost
    fonts:
    - asset: assets/fonts/Jost/Jost-Light.ttf
      weight: 300
      style: normal
    - asset: assets/fonts/Jost/Jost-Regular.ttf
      weight: 400
      style: normal
    - asset: assets/fonts/Jost/Jost-Medium.ttf
      weight: 500
      style: normal
    - asset: assets/fonts/Jost/Jost-SemiBold.ttf
      weight: 600
      style: normal
    - asset: assets/fonts/Jost/Jost-Bold.ttf
      weight: 700
      style: normal
    - asset: assets/fonts/Jost/Jost-Black.ttf
      weight: 900
      style: normal
  - family: Mulish
    fonts:
    - asset: assets/fonts/Mulish/Mulish-Light.ttf
      weight: 300
      style: normal
    - asset: assets/fonts/Mulish/Mulish-Regular.ttf
      weight: 400
      style: normal
    - asset: assets/fonts/Mulish/Mulish-Medium.ttf
      weight: 500
      style: normal
    - asset: assets/fonts/Mulish/Mulish-SemiBold.ttf
      weight: 600
      style: normal
    - asset: assets/fonts/Mulish/Mulish-Bold.ttf
      weight: 700
      style: normal
    - asset: assets/fonts/Mulish/Mulish-Black.ttf
      weight: 900
      style: normal
